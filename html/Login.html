<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link href="../bootstrap.css" rel="stylesheet">
  <style>
    .input-missing { outline: 1px solid #dc3545; outline-offset: 5px; }
    .validation-message { color: #dc3545; font-weight: normal; margin-top: 0.75rem; }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-5px); } }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <form id="loginForm" class="bg-white border rounded p-4 shadow-sm" style="width: 100%; max-width: 420px;" novalidate>
    <fieldset>
      <h1 class="h3 mb-3">Log In</h1>

      <div>
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" required>
        <div id="emailError" class="validation-message d-none">You didn't fill out this option.</div>
      </div>

      <div>
        <label for="password" class="form-label mt-3">Password</label>
        <div id="passwordGroup" class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <button class="btn btn-primary" type="button" id="showPassword" aria-label="Show password">&#128065;</button>
        </div>
        <div id="passwordError" class="validation-message d-none">You didn't fill out this option.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-4">Log in</button>
      <p id="loginStatus" class="mt-3 mb-0" aria-live="polite"></p>
      <p class="text-center mt-3 mb-0">Need an account? <a href="./SignUp.html">Sign up</a></p>
    </fieldset>
  </form>
  <script type="module" src="../javascript/signin.js"></script>
</body>
</html>
