<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email</title>
  <link rel="stylesheet" href="../bootstrap.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <main class="card shadow-sm" style="max-width: 520px;">
    <div class="card-body p-4 text-center">
      <h1 class="h2">Verify your email</h1>
      <p class="mb-2">A verification email has been sent to:</p>
      <p id="verificationEmail" class="fw-semibold"></p>
      <p class="text-muted">Open the email and use its verification link. Then return here to log in.</p>
      <a class="btn btn-primary" href="./Login.html">Go to Log In</a>
    </div>
  </main>
  <script type="module" src="../javascript/verify-email.js"></script>

</html>
